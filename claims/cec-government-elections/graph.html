utiny"}], "text": "They recorded that some decisions were issued without their knowledge, and Sandhu called a Form 6 change \"unauthorised and illegal\"."}], "id": "K11.P1", "reasoning": "If two of three commissioners repeatedly object on record, and say some decisions were issued without their knowledge, the CEC is deciding over their objections.", "role": "case", "stance": "supports", "state": "open", "title": "Fourteen dissent notes on record"}, {"check_note": "Cross-checked: evidence confirmed against its cited sources by an independent agent pass; where it suggested corrected wording, that wording was applied.", "evidence": [{"from_part": null, "sources": [{"date": "2026-10-09", "publisher": "The News Minute (Newslaundry)", "title": "From 'get lost' to dissent within ECI: Questions mount over Gyanesh Kumar's leadership", "url": "https://www.thenewsminute.com/news/a-one-man-election-commission-inside-the-allegations-against-cec-gyanesh-kumar"}], "text": "The ECI said differing views are a normal part of deliberation and that its decisions over the past year were unanimous; it did not dispute that the notes exist."}], "id": "K11.C1", "reasoning": "Differing views are normal while deciding, and the ECI says the decisions themselves were taken unanimously.", "role": "case", "stance": "challenges", "state": "open", "title": "The ECI says its decisions were unanimous"}], "plain": "The two sides block each other; it is open.", "preferences": [], "settle_by": "The commission's minutes and the dissent notes, placed before Parliament or a court.", "signal": "contested", "text": "Inside the ECI, the Chief Election Commissioner has taken decisions over the objections of the other two commissioners."}, {"edges": [{"from": "K12.P1", "kind": "case", "stance": "supports", "to": "K12"}, {"from": "K12.C1", "kind": "case", "stance": "challenges", "to": "K12"}, {"from": "K12.O1", "kind": "attack", "note": "the step from many separate decisions to one shared aim is not shown", "to": "K12.P1", "type": "undercut"}, {"from": "K12.O2", "kind": "attack", "note": "the step from big opposition wins to a fair process is not shown", "to": "K12.C1", "type": "undercut"}, {"from": "link:K1", "kind": "link", "label": "rests on", "to": "K12.P1"}], "hinge_lines": [], "id": "K12", "judgment_lines": [], "kind": "intent", "link_lines": [], "links": [{"argument": "K12.P1", "effect": "holds", "evidence": "K12.P1.e3", "part": "K1", "part_signal": "supported"}], "nodes": [{"check_note": "Cross-checked: evidence confirmed; the checker found the reasoning overreached, so it was reworded to its notes (not re-checked after rewording). In version 2, linked to part K1's result for the selection-panel point; no new source.", "evidence": [{"from_part": null, "sources": [{"date": "2026-04-07", "publisher": "Scroll", "title": "Opposition notice to remove chief election commissioner rejected by Rajya Sabha chairman, LS speaker", "url": "https://scroll.in/latest/1091926/opposition-notice-to-remove-chief-election-commissioner-rejected-by-rajya-sabha-chairman-ls-speaker"}], "text": "Removal notices against the CEC signed by 130 Lok Sabha and 63 Rajya Sabha MPs were declined in April 2026; the bulletins gave no specific reasons, though the Rajya Sabha Chairman was reported to have found no prima facie case of misbehaviour."}, {"from_part": null, "sources": [{"date": "2023-08-14", "publisher": "Scroll", "title": "A new research paper argues manipulation in 2019 polls. What does this mean for the EC?", "url": "https://scroll.in/article/1054262/a-new-research-paper-argues-manipulation-in-2019-polls-what-does-this-mean-for-the-ec"}], "text": "A 2023 paper by Sabyasachi Das, not peer reviewed at the time, found the BJP won a disproportionate share of close 2019 contests, concentrated in BJP-ruled states."}, {"from_part": "K1", "sources": [], "text": "Under the 2023 law, the government side holds a majority on the panel that picks Election Commissioners."}], "id": "K12.P1", "reasoning": "The government side holds the majority in picking commissioners, the Commission's contested decisions are the subject of formal removal notices that were declined, and a study found close-seat anomalies favouring the ruling party; critics read these together as a shared aim, though none of them shows coordination directly.", "role": "case", "stance": "supports", "state": "falls", "title": "The pieces point one way"}, {"check_note": "Cross-checked: evidence confirmed; the checker found the reasoning overreached, so it was reworded to its notes (not re-checked after rewording).", "evidence": [{"from_part": null, "sources": [{"date": "2024-06-05", "publisher": "ETV Bharat", "title": "Lok Sabha Election 2024 final result: NDA set for third term with 293 seats; INDIA bloc at 232", "url": "https://www.etvbharat.com/en/!bharat/results-for-all-lok-sabha-constituencies-declared-bjp-congress-election-commission-enn24060500653"}], "text": "In the 2024 Lok Sabha election the BJP won 240 seats, short of the 272 majority mark; the NDA won 293 and formed the government."}, {"from_part": null, "sources": [{"date": "2026-05-04", "publisher": "Scroll", "title": "Tamil Nadu election results: Vijay's TVK emerges as single-largest party, short of majority", "url": "https://scroll.in/latest/1092557/tamil-nadu-assembly-election-results-counting-of-votes-to-begin-at-8-am"}, {"date": "2026-05-05", "publisher": "Moneylife", "title": "3 CMs out, new power centres rise: BJP sweeps Bengal, retains Assam, Congress finds solace in Kerala", "url": "https://moneylife.in/article/3-cms-out-new-power-centres-rise-bjp-sweeps-bengal-retains-assam-congress-finds-solace-in-kerala/80377.html"}], "text": "In May 2026 Vijay's TVK became the largest party in Tamil Nadu with 108 seats and the BJP won 1, and Congress won Kerala; in the same round the BJP swept West Bengal and retained Assam."}], "id": "K12.C1", "reasoning": "If the referee and government were tilting elections together, the ruling party would be unlikely to lose its own majority in 2024 and lose states like Tamil Nadu and Kerala under the same Commission, even as it won others.", "role": "case", "stance": "challenges", "state": "falls", "title": "The ruling party still loses majorities and states"}, {"check_note": "Cross-checked: evidence confirmed against its cited sources by an independent agent pass; where it suggested corrected wording, that wording was applied.", "evidence": [{"from_part": null, "sources": [{"date": "2026-05-27", "publisher": "The News Minute", "title": "Supreme Court upholds validity of SIR, says ECI can examine citizenship", "url": "https://www.thenewsminute.com/india/supreme-court-upholds-validity-of-sir-says-eci-can-examine-citizenship"}], "text": "The Supreme Court upheld the SIR as within the ECI's powers."}, {"from_part": null, "sources": [{"date": "2023-08-14", "publisher": "Scroll", "title": "A new research paper argues manipulation in 2019 polls. What does this mean for the EC?", "url": "https://scroll.in/article/1054262/a-new-research-paper-argues-manipulation-in-2019-polls-what-does-this-mean-for-the-ec"}], "text": "The Das paper states that it does not provide 'proofs of fraud'; Scroll describes it as a probabilistic exercise."}], "id": "K12.O1", "reasoning": "Each decision has its own stated legal reason, the biggest one was upheld by the Supreme Court, and the study's author says it is not proof; a run of contested decisions does not show that two bodies agreed on an aim.", "role": "objection", "stance": "challenges", "state": "stands", "title": "A pattern is not a plan"}, {"check_note": "Cross-checked: evidence confirmed against its cited sources by an independent agent pass; where it suggested corrected wording, that wording was applied.", "evidence": [{"from_part": null, "sources": [{"date": "2023-08-14", "publisher": "Scroll", "title": "A new research paper argues manipulation in 2019 polls. What does this mean for the EC?", "url": "https://scroll.in/article/1054262/a-new-research-paper-argues-manipulation-in-2019-polls-what-does-this-mean-for-the-ec"}], "text": "The Das paper's anomaly was specific to closely fought seats."}], "id": "K12.O2", "reasoning": "Unfairness at the margins would show up in close seats, not in landslides, so big opposition wins do not show the process is fair.", "role": "objection", "stance": "supports", "state": "stands", "title": "Losing some races does not rule out tilting close ones"}], "plain": "Neither side's case survives the challenges against it.", "preferences": [], "settle_by": "Direct evidence of coordination, which is not public. Patterns alone cannot settle intent; the parts above, once settled, would narrow it.", "signal": "unproven either way", "text": "The CEC and the Union government are acting together to tilt elections toward the ruling party."}], "question": {"original": "CEC and modi government, together are trying to rig Indian democracy", "plain": "Are the Chief Election Commissioner and the Union government working together to make India's elections unfair?", "reframe_note": "\"Rig\" is replaced with \"make elections unfair\" so the question reads the same to both sides. The claim is then split into parts that can each be checked: how the referee is appointed, what happened to voter rolls, voting machines, rule enforcement, transparency, how the Commission works inside, and finally intent."}, "version": 2}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const byId = Object.fromEntries(D.parts.map((p) => [p.id, p]));
  const VERB = { rebut: "contradicts it:", undermine: "disputes its evidence:", undercut: "says it doesn't follow:" };
  const WORD = { "supported": "Supported", "challenged": "Challenged", "both hold in part": "Both hold in part",
                 "contested": "Open", "unproven either way": "Unproven either way", "unverified": "Not yet checked" };
  const stClass = (s) => "st-" + s.split(" ")[0];
  const h = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
  const q = (t) => "“" + t + "”";

  $("q").textContent = D.question.plain;
  $("heard").textContent = "Heard as: " + q(D.question.original) + ". " + D.question.reframe_note;
  $("foot").textContent = "A map of the evidence, not a verdict. Everything here is computed from the checked arguments and their sources, and anyone can rebuild it and get the same result.";
  $("meta").textContent = "As of " + D.as_of + " · version " + D.version + " · artifact sha256 " + D.digest;

  // ---- the map ----
  const depth = {};
  const depthOf = (p) => depth[p.id] ?? (depth[p.id] = p.links.length ? 1 + Math.max(...p.links.map((l) => depthOf(byId[l.part]))) : 0);
  D.parts.forEach(depthOf);
  const counts = {};
  D.parts.forEach((p) => { counts[WORD[p.signal]] = (counts[WORD[p.signal]] || 0) + 1; });
  const key = $("key");
  Object.entries(counts).forEach(([w, n]) => { const s = h("span"); s.append(h("b", null, w), " " + n + (n === 1 ? " part" : " parts")); key.append(s); });
  const map = $("map");
  const tiers = Math.max(...Object.values(depth));
  for (let t = 0; t <= tiers; t++) {
    if (tiers > 0) map.append(h("div", "tier-label", t === 0 ? "Parts that stand on their own evidence" : "Parts that rest on the ones above"));
    const row = h("div", "tier");
    D.parts.filter((p) => depth[p.id] === t).forEach((p) => {
      const b = h("button", "card " + stClass(p.signal)); b.type = "button"; b.dataset.id = p.id;
      b.append(h("span", "id", p.id), h("span", "txt", p.text), h("span", "word", WORD[p.signal]));
      const ups = [...new Set(p.links.map((l) => l.part))], downs = D.parts.filter((x) => x.links.some((l) => l.part === p.id)).map((x) => x.id);
      if (ups.length) b.append(h("span", "rel", "Rests on " + ups.join(", ")));
      if (downs.length) b.append(h("span", "rel", downs.join(", ") + " rests on this"));
      const related = [...ups, ...downs];
      const light = (on) => related.forEach((id) => map.querySelector(`.card[data-id="${id}"]`).classList.toggle("lit", on));
      b.addEventListener("mouseenter", () => light(true)); b.addEventListener("mouseleave", () => light(false));
      b.addEventListener("focus", () => light(true)); b.addEventListener("blur", () => light(false));
      b.addEventListener("click", () => go(p.id));
      row.append(b);
    });
    map.append(row);
  }
  const NS = "http://www.w3.org/2000/svg";

  // ---- a part ----
  const attackersOf = (p, id) => p.edges.filter((e) => e.kind === "attack" && e.to === id).map((e) => ({ e, s: p.nodes.find((n) => n.id === e.from) }));
  function whyLine(p, n) {
    const att = attackersOf(p, n.id);
    const link = p.links.find((l) => l.argument === n.id && l.effect !== "holds");
    if (n.state === "rejected at checking") return "Struck at checking: " + (n.check_note || "it could not be supported.");
    if (n.state === "falls") {
      if (link) return `Struck because it rests on ${link.part}, which is ${link.part_signal}.`;
      const a = att.find((x) => x.s.state === "stands") || att[0];
      return a ? `Struck: ${q(a.s.title)} ${VERB[a.e.type]} ${a.e.note}.` : "Struck.";
    }
    if (n.state === "open") {
      if (link) return `Undecided: it rests on ${link.part}, which is still open.`;
      const a = att.find((x) => x.s.state === "open") || att[0];
      return a ? `Undecided: it and ${q(a.s.title)} cancel each other out until one is shown to be stronger.` : "Undecided.";
    }
    if (n.state === "stands") return att.length ? `Holds: ${att.map((a) => q(a.s.title)).join(" and ")} did not hold up against it.` : "Holds: nothing that stands answers it.";
    return "Not yet checked.";
  }
  function pointEl(p, n) {
    const cls = { stands: "holds", falls: "struck", open: "open", "rejected at checking": "struck" }[n.state] || "";
    const li = h("li", "point " + cls); li.id = "pt-" + n.id;
    li.append(h("p", "claim", n.title), h("p", "why", whyLine(p, n)));
    const target = p.edges.find((e) => e.kind === "attack" && e.from === n.id);
    if (n.role === "objection" && target) li.append(h("p", "tag", "An answer to " + q(p.nodes.find((x) => x.id === target.to).title) + ", not a case on its own"));
    const d = h("details"); d.append(h("summary", null, "Reasoning and sources"), h("p", null, n.reasoning));
    const ul = h("ul");
    n.evidence.forEach((e) => {
      const it = h("li", null, e.text + " ");
      if (e.from_part) {
        const b = h("button", "jump", `(this is part ${e.from_part}, which is ${byId[e.from_part].signal})`); b.type = "button";
        b.addEventListener("click", () => go(e.from_part)); it.append(b);
      } else if (e.sources.length) {
        it.append("(");
        e.sources.forEach((s, i) => { const a = h("a", null, s.publisher + ", " + s.date); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; a.title = s.title; it.append(i ? ", " : "", a); });
        it.append(")");
      }
      ul.append(it);
    });
    d.append(ul);
    if (n.check_note) d.append(h("p", "note", "Checking: " + n.check_note));
    li.append(d);
    return li;
  }
  const chip = (id, text) => { const b = h("button", "chip", text); b.type = "button"; b.addEventListener("click", () => go(id)); return b; };
  function showPart(p) {
    $("eyebrow").textContent = `${p.id} · a question of ${p.kind}`;
    $("ptext").textContent = p.text;
    $("verdict").replaceChildren(h("b", null, WORD[p.signal] + ". "), p.plain);
    const turns = $("turns"); turns.replaceChildren();
    const lines = [...p.hinge_lines, ...p.link_lines, ...p.judgment_lines];
    if (lines.length) { const ul = h("ul"); lines.forEach((t) => ul.append(h("li", null, t))); turns.append(h("h3", null, "It turns on"), ul); }
    turns.append(h("h3", null, "What would settle it"), h("p", null, p.settle_by));
    // Cases first, strongest first; answers to the other side's points after them.
    const rank = (n) => (n.role === "objection" ? 10 : 0) + ({ stands: 0, open: 1, "not yet checked": 2, falls: 3, "rejected at checking": 4 }[n.state] ?? 5);
    for (const [side, stance] of [["pro", "supports"], ["con", "challenges"]]) {
      const ul = $(side); ul.replaceChildren();
      const pts = p.nodes.filter((n) => n.stance === stance).sort((a, b) => rank(a) - rank(b));
      pts.forEach((n) => ul.append(pointEl(p, n)));
      if (!pts.length) ul.append(h("li", "empty", "No point on this side yet."));
    }
    const settle = $("settle"); settle.replaceChildren();
    const steps = D.actions.filter((a) => a.settles.includes(p.id));
    if (steps.length) {
      const ul = h("ul");
      steps.forEach((a) => { const li = h("li"); li.append(h("p", null, a.text), h("p", "who", "Who: " + a.who + ". " + a.why_both_sides)); ul.append(li); });
      settle.append(h("h3", null, "A step both sides could take"), ul);
    }
    const ups = [...new Set(p.links.map((l) => l.part))], downs = D.parts.filter((x) => x.links.some((l) => l.part === p.id));
    if (ups.length || downs.length) {
      const c = h("div", "chips");
      ups.forEach((id) => c.append(chip(id, "Rests on " + id + ": " + WORD[byId[id].signal])));
      downs.forEach((x) => c.append(chip(x.id, x.id + " rests on this: " + WORD[x.signal])));
      settle.append(h("h3", null, "Connected parts"), c);
    }
    const i = D.parts.indexOf(p), prev = D.parts[i - 1], next = D.parts[i + 1];
    $("prev").hidden = !prev; $("next").hidden = !next;
    if (prev) { $("prev").textContent = "← " + prev.id + ". " + prev.text; $("prev").onclick = () => go(prev.id); }
    if (next) { $("next").textContent = next.id + ". " + next.text + " →"; $("next").onclick = () => go(next.id); }
    if ($("graphbox").open) drawGraph(p);
  }

  // ---- the optional graph ----
  const W = 210, H = 76, PW = 290, PH = 84, GX = 26, GY = 100, PAD = 20;
  const el = (tag, attrs = {}, text) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text !== undefined) n.textContent = text; return n; };
  const wrap = (text, n, max) => { const out = []; let cur = ""; for (const w of text.split(/\s+/)) { if ((cur + " " + w).trim().length > n && cur) { out.push(cur); cur = w; } else cur = (cur + " " + w).trim(); } if (cur) out.push(cur); if (out.length > max) { out.length = max; out[max - 1] += "…"; } return out; };
  function drawGraph(p) {
    const svg = $("g"); svg.replaceChildren();
    const cases = p.nodes.filter((n) => n.role !== "objection").sort((a, b) => (a.stance === b.stance ? 0 : a.stance === "supports" ? -1 : 1));
    const row2 = [...[...new Set(p.links.map((l) => l.part))].map((id) => ({ id: "link:" + id, part: id })), ...p.nodes.filter((n) => n.role === "objection")];
    const rowW = (n) => n * W + (n - 1) * GX;
    const width = Math.max(PW, rowW(cases.length), rowW(row2.length)) + PAD * 2;
    const pos = { [p.id]: { x: (width - PW) / 2, y: PAD, w: PW, h: PH } };
    const place = (items, y) => { const s = (width - rowW(items.length)) / 2; items.forEach((it, i) => { pos[it.id] = { x: s + i * (W + GX), y, w: W, h: H }; }); };
    place(cases, PAD + PH + GY); place(row2, PAD + PH + GY + H + GY);
    const height = PAD + PH + GY + H + (row2.length ? GY + H : 90) + PAD + 20;
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`); svg.setAttribute("width", width); svg.setAttribute("height", height);
    const defs = el("defs");
    ["for", "against", "attack", "link"].forEach((k) => { const m = el("marker", { id: "mk-" + k, viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" }); m.append(el("path", { d: "M0,0 L10,5 L0,10 z", class: "mk-" + k })); defs.append(m); });
    svg.append(defs);
    const pairs = {};
    p.edges.forEach((e) => {
      const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
      let d, lx, ly;
      if (Math.abs(a.y - b.y) < 1) {
        const k = (pairs[[e.from, e.to].sort().join("|")] = (pairs[[e.from, e.to].sort().join("|")] || 0) + 1);
        const sx = a.x + a.w / 2 + (a.x < b.x ? 20 : -20), tx = b.x + b.w / 2 + (a.x < b.x ? -20 : 20), y = a.y + a.h, dp = 34 + 30 * (k - 1);
        d = `M${sx},${y} C${sx},${y + dp * 1.4} ${tx},${y + dp * 1.4} ${tx},${y + 2}`; lx = (sx + tx) / 2; ly = y + dp * 1.05 + 4;
      } else {
        const up = a.y > b.y, sx = a.x + a.w / 2, sy = up ? a.y : a.y + a.h, tx = b.x + b.w / 2, ty = up ? b.y + b.h + 2 : b.y - 2, my = (sy + ty) / 2;
        d = `M${sx},${sy} C${sx},${my} ${tx},${my} ${tx},${ty}`; lx = (sx + tx) / 2; ly = my + 4;
      }
      const cls = e.kind === "case" ? (e.stance === "supports" ? "for" : "against") : e.kind === "link" ? "link" : "attack";
      svg.append(el("path", { d, class: "edge " + cls, "marker-end": `url(#mk-${cls})` }));
      const word = e.kind === "case" ? cls : e.kind === "link" ? e.label : { rebut: "rebuts", undermine: "undermines", undercut: "undercuts" }[e.type];
      svg.append(el("text", { x: lx, y: ly, "text-anchor": "middle", class: "elabel " + cls }, word));
    });
    const node = (id, cls, lines, sub, onClick) => {
      const b = pos[id], g = el("g", { class: "node " + cls, tabindex: "0", role: "button" });
      g.append(el("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 7 }));
      const top = b.y + b.h / 2 - ((lines.length + 1) * 16) / 2 + 12;
      lines.forEach((t, i) => g.append(el("text", { x: b.x + 12, y: top + i * 16, class: "ttl" }, t)));
      g.append(el("text", { x: b.x + 12, y: top + lines.length * 16 + 2, class: "sub" }, sub));
      g.addEventListener("click", onClick); g.addEventListener("keydown", (ev) => { if (ev.key === "Enter") onClick(); });
      svg.append(g);
    };
    node(p.id, "part", wrap(p.id + ". " + p.text, 36, 3), WORD[p.signal], () => {});
    p.nodes.forEach((n) => node(n.id, (n.stance === "supports" ? "pro " : "con ") + (n.state === "rejected at checking" ? "falls" : n.state.split(" ")[0]), wrap(n.title, 26, 3), n.state, () => flash(n.id)));
    row2.filter((r) => r.part).forEach((r) => node(r.id, "linkn", wrap("Rests on " + r.part + ": " + byId[r.part].text, 26, 2), WORD[byId[r.part].signal], () => go(r.part)));
  }
  function flash(id) {
    const li = $("pt-" + id); if (!li) return;
    li.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    li.classList.add("flash"); setTimeout(() => li.classList.remove("flash"), 1200);
  }
  $("graphbox").addEventListener("toggle", () => { if ($("graphbox").open && current) drawGraph(byId[current]); });

  // ---- routing: #K4 opens a part, anything else shows the map ----
  let current = null;
  function route(id) {
    current = byId[id] ? id : null;
    $("mapview").hidden = !!current; $("partview").hidden = !current;
    if (current) showPart(byId[current]);
    window.scrollTo(0, 0);
  }
  function go(id) {
    const target = id || "map";
    if (location.hash.slice(1) === target) { route(id); return; }
    try { location.hash = target; } catch (e) { route(id); }
  }
  window.addEventListener("hashchange", () => route(location.hash.slice(1)));
  $("back").addEventListener("click", () => go(null));
  document.addEventListener("keydown", (ev) => {
    if (!current || (ev.target.closest && ev.target.closest("input, textarea"))) return;
    const i = D.parts.findIndex((p) => p.id === current);
    if (ev.key === "ArrowRight" && D.parts[i + 1]) go(D.parts[i + 1].id);
    else if (ev.key === "ArrowLeft" && D.parts[i - 1]) go(D.parts[i - 1].id);
    else if (ev.key === "Escape") go(null);
  });
  route(location.hash.slice(1));
})();
</script>
</body>
