tries."}, {"edges": [{"from": "K8.P1", "kind": "case", "stance": "supports", "to": "K8"}, {"from": "K8.C1", "kind": "case", "stance": "challenges", "to": "K8"}, {"from": "K8.C1", "kind": "attack", "note": "the court examined the safeguards and found no shown instance", "to": "K8.P1", "type": "rebut"}, {"from": "K8.P1", "kind": "attack", "note": "a small sample can miss tampering", "to": "K8.C1", "type": "rebut"}], "hinge_lines": [], "id": "K8", "judgment_lines": ["This depends on a judgment call: \"The Supreme Court examined it and made no finding of tampering\" was judged stronger than \"Checks are too thin to catch tampering\"."], "kind": "meaning", "link_lines": [], "links": [], "nodes": [{"check_note": "Cross-checked: evidence confirmed against its cited sources by an independent agent pass; where it suggested corrected wording, that wording was applied.", "evidence": [{"from_part": null, "sources": [{"date": "2024-04-26", "publisher": "Supreme Court Observer", "title": "Supreme Court rejects plea seeking 100% vote verification with VVPATs", "url": "https://www.scobserver.in/reports/supreme-court-rejects-plea-seeking-100-vote-verification-with-vvpats/"}], "text": "ADR alleged tampering and data discrepancies and argued that VVPAT checks in only five randomly selected polling stations per constituency were insufficient."}], "id": "K8.P1", "reasoning": "Petitioners alleged data discrepancies and argued that checking paper slips in only five polling stations per seat leaves tampering possible.", "role": "case", "stance": "supports", "state": "falls", "title": "Checks are too thin to catch tampering"}, {"check_note": "Cross-checked: evidence confirmed against its cited sources by an independent agent pass; where it suggested corrected wording, that wording was applied.", "evidence": [{"from_part": null, "sources": [{"date": "2024-04-26", "publisher": "Supreme Court Observer", "title": "Supreme Court rejects plea seeking 100% vote verification with VVPATs", "url": "h w equal enforcement overall", "to": "K9.C1", "type": "rebut"}], "hinge_lines": ["Hinges on which is stronger: \"Both parties got the same treatment\" (then this part is challenged) or \"The PM's speech drew a notice to his party, not to him\" (then it is supported)."], "id": "K9", "judgment_lines": [], "kind": "meaning", "link_lines": [], "links": [], "nodes": [{"check_note": "Cross-checked: evidence confirmed against its cited sources by an independent agent pass; where it suggested corrected wording, that wording was applied.", "evidence": [{"from_part": null, "sources": [{"date": "2024-04-25", "publisher": "Onmanorama", "title": "EC notice to BJP, Congress over poll code violation plaints against Modi, Rahul Gandhi", "url": "https://www.onmanorama.com/news/india/2024/04/25/election-commission-sends-notice-to-congress-bjp-over-hate-speech.amp.html"}], "text": "On complaints about the Prime Minister's April 2024 Banswara speech, the ECI sent its notice to BJP president J P Nadda; the letter did not name Modi."}], "id": "K9.P1", "reasoning": "When the complaint was about the Prime Minister's own words, the ECI wrote to the BJP president instead, a softer step.", "role": "case", "stance": "supports", "state": "open", "title": "The PM's speech drew a notice to his party, not to him"}, {"check_note": "Cross-checked: evidence confirmed against its cited sources by an independent agent pass; where it suggested corrected wording, that wording was applied.", "evidence": [{"from_part": null, "sources": [{"date": "2024-04-25", "publisher": "Onmanorama", "title": "EC notice to BJP, Congress over poll code violation plaints against Modi, Rahul Gandhi", "url": "https://www.onmanorama.com/news/india/2024/04/25/election-commission-sends-notice-to-congress-bjp-over-hate-speech.amp.html"}], "text": "Congress president Mallikarjun Kharge received a similarly worded notice about complaints against him and Rahul Gandhi; the report says the Commission was holding party presidents responsible as a first step to rein in star campaigners."}, {"from_part": null, "sources": [{"date": "2024-04-25", "publisher": "Onmanorama", "title": "EC notice to BJP, Congress over poll code violation plaints against Modi, Rahul Gandhi", "url": "https://www.onmanorama.com/news/india/2024/04/25/election-commission-sends-notice-to-congress-bjp-over-hate-speech.amp.html"}], "text": "Officials quoted in the report said it was the first time the Commission had taken cognisance of a complaint against any prime minister."}], "id": "K9.C1", "reasoning": "The ECI handled complaints against Congress leaders the same way, through their party president, and it was the first time it took cognisance of a complaint against any prime minister.", "role": "case", "stance": "challenges", "state": "open", "title": "Both parties got the same treatment"}], "plain": "The two sides block each other; it is open.", "preferences": [], "settle_by": "A full log of Model Code complaints, with party, action taken, and days taken, analysed independently.", "signal": "contested", "text": "The ECI enforces the Model Code of Conduct more softly against the ruling party."}, {"edges": [{"from": "K10.P1", "kind": "case", "stance": "supports", "to": "K10"}], "hinge_lines": [], "id": "K10", "judgment_lines": [], "kind": "fact", "link_lines": [], "links": [], "nodes": [{"check_note": "Cross-checked: evidence confirmed against its cited sources by an independent agent pass; where it suggested corrected wording, that wording was applied.", "evidence": [{"from_part": null, "sources": [{"date": "2024-12-23", "publisher": "MediaNama", "title": "Centre amends election rule to restrict access to electronic and CCTV records", "url": "https://www.medianama.com/2024/12/223-centre-amends-election-rule-to-restrict-access-to-electronic-and-cctv-records/"}], "text": "In December 2024 Rule 93(2)(a) was amended, on the ECI's recommendation, so that only papers specified in the rules are open to public inspection, after a Hi  "supports", "state": "open", "title": "Fourteen dissent notes on record"}, {"check_note": "Cross-checked: evidence confirmed against its cited sources by an independent agent pass; where it suggested corrected wording, that wording was applied.", "evidence": [{"from_part": null, "sources": [{"date": "2026-10-09", "publisher": "The News Minute (Newslaundry)", "title": "From 'get lost' to dissent within ECI: Questions mount over Gyanesh Kumar's leadership", "url": "https://www.thenewsminute.com/news/a-one-man-election-commission-inside-the-allegations-against-cec-gyanesh-kumar"}], "text": "The ECI said differing views are a normal part of deliberation and that its decisions over the past year were unanimous; it did not dispute that the notes exist."}], "id": "K11.C1", "reasoning": "Differing views are normal while deciding, and the ECI says the decisions themselves were taken unanimously.", "role": "case", "stance": "challenges", "state": "open", "title": "The ECI says its decisions were unanimous"}], "plain": "The two sides block each other; it is open.", "preferences": [], "settle_by": "The commission's minutes and the dissent notes, placed before Parliament or a court.", "signal": "contested", "text": "Inside the ECI, the Chief Election Commissioner has taken decisions over the objections of the other two commissioners."}, {"edges": [{"from": "K12.P1", "kind": "case", "stance": "supports", "to": "K12"}, {"from": "K12.C1", "kind": "case", "stance": "challenges", "to": "K12"}, {"from": "K12.O1", "kind": "attack", "note": "the step from many separate decisions to one shared aim is not shown", "to": "K12.P1", "type": "undercut"}, {"from": "K12.O2", "kind": "attack", "note": "the step from big opposition wins to a fair process is not shown", "to": "K12.C1", "type": "undercut"}, {"from": "link:K1", "kind": "link", "label": "rests on", "to": "K12.P1"}], "hinge_lines": [], "id": "K12", "judgment_lines": [], "kind": "intent", "link_lines": [], "links": [{"argument": "K12.P1", "effect": "holds", "evidence": "K12.P1.e3", "part": "K1", "part_signal": "supported"}], "nodes": [{"check_note": "Cross-checked: evidence confirmed; the checker found the reasoning overreached, so it was reworded to its notes (not re-checked after rewording). In version 2, linked to part K1's result for the selection-panel point; no new source.", "evidence": [{"from_part": null, "sources": [{"date": "2026-04-07", "publisher": "Scroll", "title": "Opposition notice to remove chief election commissioner rejected by Rajya Sabha chairman, LS speaker", "url": "https://scroll.in/latest/1091926/opposition-notice-to-remove-chief-election-commissioner-rejected-by-rajya-sabha-chairman-ls-speaker"}], "text": "Removal notices against the CEC signed by 130 Lok Sabha and 63 Rajya Sabha MPs were declined in April 2026; the bulletins gave no specific reasons, though the Rajya Sabha Chairman was reported to have found no prima facie case of misbehaviour."}, {"from_part": null, "sources": [{"date": "2023-08-14", "publisher": "Scroll", "title": "A new research paper argues manipulation in 2019 polls. What does this mean for the EC?", "url": "https://scroll.in/article/1054262/a-new-research-paper-argues-manipulation-in-2019-polls-what-does-this-mean-for-the-ec"}], "text": "A 2023 paper by Sabyasachi Das, not peer reviewed at the time, found the BJP won a disproportionate share of close 2019 contests, concentrated in BJP-ruled states."}, {"from_part": "K1", "sources": [], "text": "Under the 2023 law, the government side holds a majority on the panel that picks Election Commissioners."}], "id": "K12.P1", "reasoning": "The government side holds the majority in picking commissioners, the Commission's contested decisions are the subject of formal removal notices that were declined, and a study found close-seat anomalies favouring the ruling party; critics read these together as a shared aim, though none of them shows coordination directly.", "role": "case", "stance": "supports", "state": "falls", "title": "The pieces point one way"}, {"check_note": "Cross-checked: evidence confirmed; the checker found the reasoning overreached, so it was reworded to its notes (not re-checked after rewording).", "evidence": [{"from_part": null, "sources": [{"date": "2024-06-05", "publisher": "ETV Bharat", "title": "Lok Sabha Election 2024 final result: NDA set for third term with 293 seats; INDIA bloc at 232", "url": "https://www.etvbharat.com/en/!bharat/results-for-all-lok-sabha-constituencies-declared-bjp-congress-election-commission-enn24060500653"}], "text": "In the 2024 Lok Sabha election the BJP won 240 seats, short of the 272 majority mark; the NDA won 293 and formed the government."}, {"from_part": null, "sources": [{"date": "2026-05-04", "publisher": "Scroll", "title": "Tamil Nadu election results: Vijay's TVK emerges as single-largest party, short of majority", "url": "https://scroll.in/latest/1092557/tamil-nadu-assembly-election-results-counting-of-votes-to-begin-at-8-am"}, {"date": "2026-05-05", "publisher": "Moneylife", "title": "3 CMs out, new power centres rise: BJP sweeps Bengal, retains Assam, Congress finds solace in Kerala", "url": "https://moneylife.in/article/3-cms-out-new-power-centres-rise-bjp-sweeps-bengal-retains-assam-congress-finds-solace-in-kerala/80377.html"}], "text": "In May 2026 Vijay's TVK became the largest party in Tamil Nadu with 108 seats and the BJP won 1, and Congress won Kerala; in the same round the BJP swept West Bengal and retained Assam."}], "id": "K12.C1", "reasoning": "If the referee and government were tilting elections together, the ruling party would be unlikely to lose its own majority in 2024 and lose states like Tamil Nadu and Kerala under the same Commission, even as it won others.", "role": "case", "stance": "challenges", "state": "falls", "title": "The ruling party still loses majorities and states"}, {"check_note": "Cross-checked: evidence confirmed against its cited sources by an independent agent pass; where it suggested corrected wording, that wording was applied.", "evidence": [{"from_part": null, "sources": [{"date": "2026-05-27", "publisher": "The News Minute", "title": "Supreme Court upholds validity of SIR, says ECI can examine citizenship", "url": "https://www.thenewsminute.com/india/supreme-court-upholds-validity-of-sir-says-eci-can-examine-citizenship"}], "text": "The Supreme Court upheld the SIR as within the ECI's powers."}, {"from_part": null, "sources": [{"date": "2023-08-14", "publisher": "Scroll", "title": "A new research paper argues manipulation in 2019 polls. What does this mean for the EC?", "url": "https://scroll.in/article/1054262/a-new-research-paper-argues-manipulation-in-2019-polls-what-does-this-mean-for-the-ec"}], "text": "The Das paper states that it does not provide 'proofs of fraud'; Scroll describes it as a probabilistic exercise."}], "id": "K12.O1", "reasoning": "Each decision has its own stated legal reason, the biggest one was upheld by the Supreme Court, and the study's author says it is not proof; a run of contested decisions does not show that two bodies agreed on an aim.", "role": "objection", "stance": "challenges", "state": "stands", "title": "A pattern is not a plan"}, {"check_note": "Cross-checked: evidence confirmed against its cited sources by an independent agent pass; where it suggested corrected wording, that wording was applied.", "evidence": [{"from_part": null, "sources": [{"date": "2023-08-14", "publisher": "Scroll", "title": "A new research paper argues manipulation in 2019 polls. What does this mean for the EC?", "url": "https://scroll.in/article/1054262/a-new-research-paper-argues-manipulation-in-2019-polls-what-does-this-mean-for-the-ec"}], "text": "The Das paper's anomaly was specific to closely fought seats."}], "id": "K12.O2", "reasoning": "Unfairness at the margins would show up in close seats, not in landslides, so big opposition wins do not show the process is fair.", "role": "objection", "stance": "supports", "state": "stands", "title": "Losing some races does not rule out tilting close ones"}], "plain": "Neither side's case survives the challenges against it.", "preferences": [], "settle_by": "Direct evidence of coordination, which is not public. Patterns alone cannot settle intent; the parts above, once settled, would narrow it.", "signal": "unproven either way", "text": "The CEC and the Union government are acting together to tilt elections toward the ruling party."}], "question": {"original": "CEC and modi government, together are trying to rig Indian democracy", "plain": "Are the Chief Election Commissioner and the Union government working together to make India's elections unfair?", "reframe_note": "\"Rig\" is replaced with \"make elections unfair\" so the question reads the same to both sides. The claim is then split into parts that can each be checked: how the referee is appointed, what happened to voter rolls, voting machines, rule enforcement, transparency, how the Commission works inside, and finally intent."}, "version": 2}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const W = 220, H = 84, PW = 300, PH = 96, GX = 28, GY = 120, PAD = 24;
  const SIDE = { supports: "pro", challenges: "con" };
  const SIDE_WORD = { supports: "For", challenges: "Against" };
  const VERB = { rebut: "rebuts", undermine: "undermines", undercut: "undercuts" };
  const byId = Object.fromEntries(D.parts.map((p) => [p.id, p]));
  let current = null, selected = null;

  const el = (tag, attrs = {}, text) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const h = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
  const chipClass = (s) => "chip s-" + s.split(" ")[0];
  const wrap = (text, n, max) => {
    const lines = []; let cur = "";
    for (const w of text.split(/\s+/)) {
      if ((cur + " " + w).trim().length > n && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim();
    }
    if (cur) lines.push(cur);
    if (lines.length > max) { lines.length = max; lines[max - 1] = lines[max - 1].replace(/\s*\S*$/, "") + "…"; }
    return lines;
  };

  $("q").textContent = D.question.plain;
  $("heard").textContent = "Heard as: “" + D.question.original + "”. " + D.question.reframe_note;
  $("meta").textContent = "As of " + D.as_of + " · version " + D.version + " · artifact " + D.digest.slice(0, 12);
  $("foot").textContent = "A map of the evidence, not a verdict on any person or party. Each part is checked on its own and the parts are never added up. Drawn from artifact sha256 " + D.digest + ".";

  const list = $("parts");
  D.parts.forEach((p) => {
    const li = h("li"), b = h("button");
    b.type = "button"; b.dataset.id = p.id;
    b.append(h("span", "pid", p.id), h("span", "ptext", p.text), h("span", chipClass(p.signal), p.signal));
    b.addEventListener("click", () => show(p.id));
    li.append(b); list.append(li);
  });

  function layout(p) {
    const cases = p.nodes.filter((n) => n.role !== "objection");
    cases.sort((a, b) => (a.stance === b.stance ? 0 : a.stance === "supports" ? -1 : 1));
    const pos = {};
    const rowW = (n, w) => n * w + (n - 1) * GX;
    const linked = [...new Set(p.links.map((l) => l.part))];
    const objections = p.nodes.filter((n) => n.role === "objection");
    const row2 = [...linked.map((part) => ({ kind: "link", id: "link:" + part, link: p.links.find((l) => l.part === part) })),
                  ...objections.map((n) => ({ kind: "arg", id: n.id }))];
    const width = Math.max(PW, rowW(cases.length, W), rowW(row2.length, W)) + PAD * 2;
    const place = (items, y, w) => { const start = (width - rowW(items.length, w)) / 2; items.forEach((it, i) => { pos[it.id] = { x: start + i * (w + GX), y, w, h: w === PW ? PH : H }; }); };
    pos[p.id] = { x: (width - PW) / 2, y: PAD, w: PW, h: PH };
    place(cases, PAD + PH + GY, W);
    // Objections sit under what they attack, when that is free.
    const order = row2.slice().sort((a, b) => {
      const tx = (it) => { const e = p.edges.find((x) => x.from === it.id && x.kind !== "case"); return e && pos[e.to] ? pos[e.to].x : (it.kind === "link" ? -1 : 1e6); };
      return tx(a) - tx(b);
    });
    place(order, PAD + PH + GY + H + GY, W);
    const height = PAD + PH + GY + H + (row2.length ? GY + H : 90) + PAD + 30;
    return { pos, width, height, row2 };
  }

  function draw(p) {
    const svg = $("g"); svg.replaceChildren(); svg.classList.remove("focused");
    const { pos, width, height, row2 } = layout(p);
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`); svg.setAttribute("width", width); svg.setAttribute("height", height);
    const defs = el("defs");
    for (const k of ["for", "against", "attack", "link"]) {
      const m = el("marker", { id: "mk-" + k, viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" });
      m.append(el("path", { d: "M0,0 L10,5 L0,10 z", class: "mk-" + k })); defs.append(m);
    }
    svg.append(defs);
    const edgeLayer = el("g"), labelLayer = el("g"), nodeLayer = el("g");
    svg.append(edgeLayer, nodeLayer, labelLayer);
    const pairCount = {};
    p.edges.forEach((e) => {
      const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
      let d, lx, ly;
      if (Math.abs(a.y - b.y) < 1) {
        const key = [e.from, e.to].sort().join("|"); const k = (pairCount[key] = (pairCount[key] || 0) + 1);
        const sx = a.x + a.w / 2 + (a.x < b.x ? 20 : -20), tx = b.x + b.w / 2 + (a.x < b.x ? -20 : 20);
        const y = a.y + a.h, depth = 34 + 30 * (k - 1);
        d = `M${sx},${y} C${sx},${y + depth * 1.4} ${tx},${y + depth * 1.4} ${tx},${y + 2}`;
        lx = (sx + tx) / 2; ly = y + depth * 1.05 + 4;
      } else {
        const up = a.y > b.y;
        const sx = a.x + a.w / 2, sy = up ? a.y : a.y + a.h, tx = b.x + b.w / 2, ty = up ? b.y + b.h + 2 : b.y - 2;
        const my = (sy + ty) / 2;
        d = `M${sx},${sy} C${sx},${my} ${tx},${my} ${tx},${ty}`;
        lx = (sx + tx) / 2; ly = my + 4;
      }
      const cls = e.kind === "case" ? (e.stance === "supports" ? "for" : "against") : e.kind === "link" ? "link" : "attack";
      const near = [e.from, e.to].join(" ");
      edgeLayer.append(el("path", { d, class: "edge " + cls, "marker-end": `url(#mk-${cls})`, "data-ends": near }));
      const word = e.kind === "case" ? (e.stance === "supports" ? "for" : "against") : e.kind === "link" ? e.label : VERB[e.type];
      labelLayer.append(el("text", { x: lx, y: ly, "text-anchor": "middle", class: "elabel " + cls, "data-ends": near }, word));
    });
    const addNode = (id, cls, lines, sub, onClick, label) => {
      const b = pos[id]; const g = el("g", { class: "node " + cls, tabindex: "0", role: "button", "aria-label": label, "data-id": id });
      g.append(el("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 7 }));
      const top = b.y + b.h / 2 - ((lines.length + (sub ? 1 : 0)) * 17) / 2 + 13;
      lines.forEach((t, i) => g.append(el("text", { x: b.x + 12, y: top + i * 17, class: "ttl" }, t)));
      if (sub) g.append(el("text", { x: b.x + 12, y: top + lines.length * 17 + 2, class: "sub" }, sub));
      g.addEventListener("click", onClick);
      g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); onClick(); } });
      nodeLayer.append(g);
    };
    addNode(p.id, "part", wrap(p.id + ". " + p.text, 38, 3), p.signal, () => select(null), p.id + ", " + p.signal);
    p.nodes.forEach((n) => {
      const state = n.state.split(" ")[0];
      const sub = n.state + (n.role === "objection" ? " · objection" : "");
      addNode(n.id, `${SIDE[n.stance]} ${state === "rejected" ? "falls" : state}`, wrap(n.title, 27, 3), sub, () => select(n.id), `${SIDE_WORD[n.stance]}: ${n.title}, ${n.state}`);
    });
    row2.filter((r) => r.kind === "link").forEach((r) => {
      const l = r.link;
      addNode(r.id, "linkn", wrap("Rests on " + l.part + ": " + byId[l.part].text, 27, 2), l.part_signal, () => show(l.part), "Open part " + l.part);
    });
  }

  function argDetail(p, n) {
    const panel = $("panel"); panel.replaceChildren();
    panel.append(h("p", "eyebrow", `${SIDE_WORD[n.stance]} ${p.id} · ${n.role === "objection" ? "objection" : "case"}`), h("h3", null, n.title));
    const attackers = p.edges.filter((e) => e.kind === "attack" && e.to === n.id);
    const links = p.links.filter((l) => l.argument === n.id);
    const state = h("p"); state.append(h("span", "state", n.state.charAt(0).toUpperCase() + n.state.slice(1) + ". "));
    const why = [];
    attackers.forEach((e) => { const s = p.nodes.find((x) => x.id === e.from); why.push(`“${s.title}” ${VERB[e.type]} it (${s.state})`); });
    links.filter((l) => l.effect !== "holds").forEach((l) => why.push(`it rests on ${l.part}, which is ${l.part_signal}`));
    if (why.length) state.append(document.createTextNode(why.join("; ") + "."));
    else if (n.state === "stands") state.append(document.createTextNode("Nothing that stands attacks it."));
    panel.append(state, h("p", null, n.reasoning));
    panel.append(h("h4", null, "Evidence"));
    const ul = h("ul");
    n.evidence.forEach((e) => {
      const li = h("li", null, e.text + " ");
      if (e.from_part) {
        const b = h("button", "jump", `Rests on ${e.from_part}, which is ${byId[e.from_part].signal}`); b.type = "button";
        b.addEventListener("click", () => show(e.from_part)); li.append(b);
      } else e.sources.forEach((s, i) => {
        const a = h("a", null, `${s.publisher}, ${s.date}`); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; a.title = s.title;
        li.append(i ? ", " : "(", a); if (i === e.sources.length - 1) li.append(")");
      });
      ul.append(li);
    });
    panel.append(ul);
    const out = p.edges.filter((e) => e.kind === "attack" && e.from === n.id);
    if (out.length || attackers.length) {
      panel.append(h("h4", null, "How it meets the other side"));
      const m = h("ul");
      [...attackers, ...out].forEach((e) => {
        const s = p.nodes.find((x) => x.id === e.from), t = p.nodes.find((x) => x.id === e.to);
        m.append(h("li", null, `“${s.title}” ${VERB[e.type]} “${t.title}”: ${e.note}`));
      });
      panel.append(m);
    }
    p.preferences.filter((x) => x.preferred === n.id || x.over === n.id).forEach((x) => {
      const a = p.nodes.find((y) => y.id === x.preferred), b = p.nodes.find((y) => y.id === x.over);
      panel.append(h("p", "note", `Judged stronger: “${a.title}” over “${b.title}”. ${x.rationale} This is a judgment call, open to challenge.`));
    });
    if (n.check_note) panel.append(h("p", "note", "Checking: " + n.check_note));
  }

  function partDetail(p) {
    const panel = $("panel"); panel.replaceChildren();
    panel.append(h("p", "eyebrow", `${p.id} · ${p.kind} · ${p.signal}`), h("h3", null, p.text), h("p", null, p.plain));
    const open = [...p.hinge_lines, ...p.link_lines, ...p.judgment_lines];
    if (open.length) { panel.append(h("h4", null, "What it turns on")); const ul = h("ul"); open.forEach((t) => ul.append(h("li", null, t))); panel.append(ul); }
    panel.append(h("h4", null, "What would settle it"), h("p", null, p.settle_by));
    const users = D.parts.filter((q) => q.links.some((l) => l.part === p.id));
    if (users.length) {
      panel.append(h("h4", null, "Parts that rest on this one"));
      const ul = h("ul");
      users.forEach((q) => { const li = h("li"), b = h("button", "jump", `${q.id}. ${q.text}`); b.type = "button"; b.addEventListener("click", () => show(q.id)); li.append(b, ` (${q.signal})`); ul.append(li); });
      panel.append(ul);
    }
    panel.append(h("p", "note", "Tap an argument in the graph to see its evidence and what it faces."));
  }

  function select(id) {
    selected = id;
    const svg = $("g"), p = byId[current];
    svg.classList.toggle("focused", !!id);
    svg.querySelectorAll(".node").forEach((n) => { n.classList.toggle("sel", n.dataset.id === (id || current)); n.classList.toggle("near", !!id && n.dataset.id === id); });
    svg.querySelectorAll("[data-ends]").forEach((e) => {
      const ends = e.dataset.ends.split(" "); const hit = !!id && ends.includes(id);
      e.classList.toggle("near", hit);
      if (hit) ends.forEach((x) => { const n = svg.querySelector(`.node[data-id="${CSS.escape(x)}"]`); if (n) n.classList.add("near"); });
    });
    if (id) argDetail(p, p.nodes.find((n) => n.id === id)); else partDetail(p);
  }

  function show(id) {
    if (!byId[id]) return;
    current = id;
    const p = byId[id];
    list.querySelectorAll("button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.id === id)));
    $("kind").textContent = `${p.kind} · ${p.signal}`; $("ptitle").textContent = `${p.id}. ${p.text}`;
    draw(p); select(null);
    const canvas = document.querySelector(".canvas");
    canvas.scrollLeft = (canvas.scrollWidth - canvas.clientWidth) / 2;
    const cur = list.querySelector(`button[data-id="${CSS.escape(id)}"]`).parentElement;
    if (list.scrollWidth > list.clientWidth) list.scrollLeft = cur.offsetLeft - list.offsetLeft - 8;
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
  }

  document.addEventListener("keydown", (ev) => {
    if (ev.target.closest && ev.target.closest("input, textarea")) return;
    const i = D.parts.findIndex((p) => p.id === current);
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      const next = D.parts[(i + (ev.key === "ArrowDown" ? 1 : D.parts.length - 1)) % D.parts.length];
      show(next.id); list.querySelector(`button[data-id="${CSS.escape(next.id)}"]`).focus();
    } else if (ev.key === "Escape") select(null);
  });

  const start = location.hash.slice(1);
  show(byId[start] ? start : D.parts[0].id);
})();
</script>
</body>
</html>
